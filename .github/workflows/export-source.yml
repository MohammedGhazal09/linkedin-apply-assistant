name: Export source for remediation workspace

on:
  push:
    branches:
      - fix/audit-remediation-all-findings

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Create source archive
        run: tar --exclude=.git -czf linkedin-apply-assistant-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: remediation-source
          path: linkedin-apply-assistant-source.tar.gz
          if-no-files-found: error
          retention-days: 1
