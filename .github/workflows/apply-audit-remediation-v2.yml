name: Apply audit remediation v2

on:
  workflow_dispatch:
  push:
    branches:
      - fix/audit-remediation-all-findings
    paths:
      - scripts/_remediate_hotfix_20260820.py
      - .github/workflows/apply-audit-remediation-v2.yml

permissions:
  contents: write

concurrency:
  group: apply-audit-remediation
  cancel-in-progress: true

jobs:
  remediate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-remediation-all-findings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install generator tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pip-tools>=7.4,<8"
      - name: Generate the consolidated remediation
        run: |
          python scripts/_run_audit_remediation_20260820.py
          python scripts/_remediate_hotfix_20260820.py
      - name: Install the locked dependency closure and browser
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install --no-deps -e .
          python -m playwright install --with-deps chromium
      - name: Format final source and tests
        run: python -m ruff format src tests
      - name: Focused exploit-regression verification
        run: |
          python -m pytest tests/test_security_regressions.py -q
          python -m pytest tests/test_browser_e2e.py -q -m live
      - name: Full repository verification
        run: |
          python -m pytest tests -q
          python -m ruff check --no-cache src tests
          python -m ruff format --check --no-cache src tests
          python -m mypy src/linkedin_apply_assistant
          python scripts/quality.py
      - name: Release and distribution verification
        run: |
          python scripts/release.py clean
          python scripts/release.py manifest --check
          python scripts/release.py verify
          npm pack --dry-run --json
      - name: Commit and push only the verified final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: remediate comprehensive repository audit"
          git push origin HEAD:fix/audit-remediation-all-findings
